<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Datashield.Ai Futuristic Popup</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 400px;
      height: 600px;
      background: hsl(222 47% 11%);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, "Roboto Mono", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: hsl(210 40% 98%);
      overflow: hidden;
      position: relative;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Background with subtle gradient */
    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, hsl(222 47% 13%) 0%, hsl(217 33% 17%) 100%);
      pointer-events: none;
      z-index: 0;
    }

    @keyframes gridMove {
      0% { transform: translate(0, 0); }
      100% { transform: translate(20px, 20px); }
    }

    .container {
      position: relative;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 1rem;
      z-index: 1;
    }

    /* Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem;
      background: hsl(222 47% 13%);
      border: 1px solid hsl(217 33% 25%);
      border-radius: 12px;
      box-shadow: 0 0 20px hsl(189 100% 50% / 0.1);
      margin-bottom: 1rem;
      position: relative;
      overflow: hidden;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    header h1 {
      font-size: 1.1rem;
      font-weight: 700;
      color: hsl(189 100% 50%);
      letter-spacing: 1px;
    }

    .status-badge {
      padding: 0.25rem 0.75rem;
      background: hsl(189 100% 50% / 0.1);
      border: 1px solid hsl(189 100% 50%);
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 700;
      color: hsl(189 100% 50%);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 10px hsl(189 100% 50% / 0.6); }
      50% { opacity: 0.8; box-shadow: 0 0 20px hsl(189 100% 50% / 0.6); }
    }

    /* Main Content */
    main {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding-right: 0.5rem;
      scrollbar-width: thin;
      scrollbar-color: #00fffb rgba(0, 255, 153, 0.1);
    }

    main::-webkit-scrollbar {
      width: 4px;
    }

    main::-webkit-scrollbar-track {
      background: rgba(0, 255, 153, 0.05);
      border-radius: 10px;
    }

    main::-webkit-scrollbar-thumb {
      background: #00ff99;
      border-radius: 10px;
    }

    /* Trust Status Card */
    .trust-card {
      background: linear-gradient(135deg, rgba(0, 255, 153, 0.1), rgba(0, 204, 119, 0.05));
      border: 2px solid #00eaff;
      border-radius: 16px;
      padding: 1.5rem;
      text-align: center;
      margin-bottom: 1rem;
      box-shadow: 0 0 30px rgba(0, 255, 153, 0.2);
      position: relative;
      overflow: hidden;
    }

    .trust-card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(0, 255, 153, 0.1) 0%, transparent 70%);
      animation: rotate 10s linear infinite;
    }

    @keyframes rotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .trust-card-content {
      position: relative;
      z-index: 1;
    }

    .trust-icon {
      width: 60px;
      height: 60px;
      margin: 0 auto 0.75rem;
      background: linear-gradient(135deg, #bbff00, #0030cc);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      box-shadow: 0 0 25px rgba(0, 106, 255, 0.6);
      animation: float 3s ease-in-out infinite, lookAround 4s ease-in-out infinite;

    }

    @keyframes lookAround {
      0%, 100% { transform: translateY(0) translateX(0); }
      25% { transform: translateY(-10px) translateX(-5px); }
      50% { transform: translateY(0) translateX(5px); }
      75% { transform: translateY(-10px) translateX(-5px); }
    }

   @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    #trust-text {
      font-size: 1.3rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: hsl(189 100% 50%);
      margin-bottom: 0.5rem;
    }

    .trust-subtitle {
      font-size: 0.8rem;
      color: hsl(215 20% 65%);
      font-weight: 400;
    }

    /* Info Grid */
    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    .info-card {
      background: rgba(0, 255, 153, 0.05);
      border: 1px solid rgba(0, 255, 153, 0.2);
      border-radius: 10px;
      padding: 0.75rem;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .info-card:hover {
      background: rgba(0, 255, 153, 0.1);
      border-color: #00ff99;
      box-shadow: 0 0 15px rgba(0, 255, 153, 0.2);
      transform: translateY(-2px);
    }

    .info-card strong {
      display: block;
      font-size: 0.7rem;
      opacity: 0.7;
      margin-bottom: 0.25rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .info-card span {
      font-size: 0.85rem;
      font-weight: 700;
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* IP Location Card */
    .location-card {
      background: rgba(0, 255, 153, 0.05);
      border: 1px solid rgba(0, 255, 153, 0.2);
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 1rem;
    }

    .location-header {
      font-size: 0.9rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .location-icon {
      width: 20px;
      height: 20px;
      background: linear-gradient(135deg, #00ff99, #00cc77);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      color: #0a0e27;
    }

    /* Security Status Card */
    .security-card {
      background: rgba(0, 255, 153, 0.05);
      border: 1px solid rgba(0, 255, 153, 0.2);
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 1rem;
    }

    .security-header {
      font-size: 0.9rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .security-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .security-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.8rem;
      padding: 0.5rem;
      background: rgba(0, 255, 153, 0.03);
      border-radius: 6px;
      transition: all 0.3s ease;
    }

    .security-item:hover {
      background: rgba(0, 255, 153, 0.08);
    }

    .security-status-icon {
      width: 20px;
      height: 20px;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      animation: blink 2s ease-in-out infinite;
      box-shadow: 0 0 10px currentColor;
    }

    .status-dot.green {
      background: #0037ff;
      color: #00ff99;
    }

    .status-dot.blue {
      background: #00ccff;
      color: #00ccff;
    }

    .status-dot.purple {
      background: #cc00ff;
      color: #cc00ff;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* Footer Button */
    footer {
      margin-top: 1rem;
    }

    .action-btn {
      width: 100%;
      padding: 1rem;
      font-size: 1rem;
      font-weight: 700;
      color: #0a0e27;
      background: linear-gradient(135deg, #f2ff00, #0047cc);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(0, 255, 153, 0.4);
      transition: all 0.3s ease;
      font-family: 'Orbitron', sans-serif;
      text-transform: uppercase;
      letter-spacing: 2px;
      position: relative;
      overflow: hidden;
    }

    .action-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      transition: left 0.5s ease;
    }

    .action-btn:hover {
      background: linear-gradient(135deg, #0036cc, #004d99);
      box-shadow: 0 0 35px rgba(0, 255, 242, 0.7);
      transform: translateY(-3px);
    }

    .action-btn:hover::before {
      left: 100%;
    }

    .action-btn:active {
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo-container">
        <img
          src="ShieldLogo.jpg"
          alt="DataShield Logo"
          style="width: 35px; height: 35px; object-fit: contain; border-radius: 6px"
        />
        <h1 style="padding-left: 8px">DATASHIELD.AI</h1>
      </div>
      <div class="status-badge">ACTIVE</div>
    </header>

    <main>
      <!-- Trust Status Card -->
      <div class="trust-card">
        <div class="trust-card-content">
          <div class="trust-icon">👀</div>
          <div id="trust-text">ANALYZING...</div>
          <div id="trust-subtitle" class="trust-subtitle">Please wait</div>
        </div>
      </div>

      <!-- Info Grid -->
      <div class="info-grid">
        <div class="info-card">
          <strong>URL</strong>
          <span id="source-url">loading...</span>
        </div>
        <div class="info-card">
          <strong>IP Address</strong>
          <span id="ip-address">N/A</span>
        </div>
        <div class="info-card">
          <strong>ASN</strong>
          <span id="asn">N/A</span>
        </div>
        <div class="info-card">
          <strong>Location</strong>
          <span id="location">N/A</span>
        </div>
      </div>

      <!-- IP Location Info -->
      <div class="location-card">
        <div class="location-header">
          <div class="location-icon">📍</div>
          <span>Session Information</span>
        </div>
        <div class="info-grid">
          <div class="info-card">
            <strong>Country / Region</strong>
            <span id="country">--</span>
          </div>
          <div class="info-card">
            <strong>City</strong>
            <span id="city">--</span>
          </div>
          <div class="info-card">
            <strong>ISP</strong>
            <span id="isp">--</span>
          </div>
          <div class="info-card">
            <strong>Timezone</strong>
            <span id="timezone">--</span>
          </div>
        </div>
      </div>

      <!-- Real-time Security -->
      <div class="security-card">
        <div class="security-header">
          <div class="location-icon">⚡</div>
          <span>Real-time Security</span>
        </div>
        <div class="security-list">
          <div class="security-item">
            <div class="security-status-icon">📡</div>
            <span>IP tracking active</span>
          </div>
          <div class="security-item">
            <div class="security-status-icon">🌍</div>
            <span>Location monitoring</span>
          </div>
          <div class="security-item">
            <div class="security-status-icon">🛡️</div>
            <span>Session protection</span>
          </div>
        </div>
      </div>
    </main>

    <footer>
      <button class="action-btn" id="manageBtn">
        View Full Report →
      </button>
    </footer>
  </div>

  <!-- Link to the external JavaScript file for popup logic -->
  <script src="popup.js"></script>
</body>
</html>
